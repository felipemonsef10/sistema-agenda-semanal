<div class="container">
    <div class="row">
        <div class="col">
            {% if current_user.is_admin %}
                <ul class="nav">
                    <li class="nav-item">
                        <a class="nav-link {% if request.endpoint == 'tela_admin' %}active{% endif %}" href="{{ url_for('home') }}">Agendas</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.endpoint == 'usuarios' %}active{% endif %}" href="{{ url_for('usuarios') }}">Usuários</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.endpoint == 'regioes' %}active{% endif %}" href="{{ url_for('regioes') }}">Regiões</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link disabled" aria-disabled="true">Disabled</a>
                    </li>
                </ul>
            {% endif %}
        </div>
        <div class="col">
            <ul class="nav justify-content-end">
                {% if not current_user.is_admin %}
                    <li class="nav-item m-2">
                        <a href="{{ url_for('baixar_agenda') }}" 
                        class="nav-link active"
                        onclick="setTimeout(function(){ window.location.href = '/home'; }, 1000);">
                        Baixar Arquivo
                        </a>
                    </li>
                {% endif %}
                <li class="nav-item m-2">
                    <a class="nav-link active" href="{{ url_for('logout') }}" style="background-color:lightskyblue;">Sair</a>
                </li>
            </ul>
        </div>
    </div>
</div>
